services:
  grafana-postgres:
    image: postgres:16
    container_name: grafana-postgres
    hostname: grafana-postgres
    volumes:
      - $COMMON_PATH/grafana/postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: $GRAFANA_POSTGRES_USER
      POSTGRES_PASSWORD: $GRAFANA_POSTGRES_PASSWORD
      POSTGRES_DB: $GRAFANA_POSTGRES_DB
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $GRAFANA_POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse_platform

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    hostname: node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - lakehouse_platform

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    hostname: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8085:8080"
    networks:
      - lakehouse_platform

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    volumes:
      - $PROJECT_PATH/lakehouse-platform/grafana/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - $COMMON_PATH/prometheus/data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
    ports:
      - "9091:9090"
    networks:
      - lakehouse_platform

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    volumes:
      - $COMMON_PATH/grafana/data:/var/lib/grafana
      - $PROJECT_PATH/lakehouse-platform/grafana/provisioning:/etc/grafana/provisioning
      - $PROJECT_PATH/lakehouse-platform/grafana/dashboards:/etc/grafana/provisioning/dashboards/files
    environment:
      GF_SECURITY_ADMIN_USER: $GRAFANA_ADMIN_USER
      GF_SECURITY_ADMIN_PASSWORD: $GRAFANA_ADMIN_PASSWORD
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: grafana-postgres:5432
      GF_DATABASE_NAME: $GRAFANA_POSTGRES_DB
      GF_DATABASE_USER: $GRAFANA_POSTGRES_USER
      GF_DATABASE_PASSWORD: $GRAFANA_POSTGRES_PASSWORD
    depends_on:
      grafana-postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - lakehouse_platform

networks:
  lakehouse_platform:
    external: true
