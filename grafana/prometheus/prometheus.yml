global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # lunar-airlock (Airflow on kind-my-cluster) — exposed via standalone
  # NodePort Services (lunar-airlock/scripts/monitoring/
  # lunar-airlock-nodeport-services.yaml), reachable because kind's own
  # node containers sit on this same lakehouse_platform network.
  - job_name: lunar-airlock-statsd
    static_configs:
      - targets: ["my-cluster-worker:30902"]

  - job_name: lunar-airlock-pgbouncer
    static_configs:
      - targets: ["my-cluster-worker:30927"]
